name: Tests

on: 
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer Node.js 
        uses: actions/setup-node@v7
        with: 
          node-version: 24

      - name: Installer les dépendances
        run: npm install 

      - name: Lancer les tests 
        run: npm test